name: Experience

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update experience
        run: |
          read -r year month < <(date '+%Y %m')
          total=$(( (year - 2020) * 12 + 10#$month - 1 ))
          years=$(( total / 12 )) months=$(( total % 12 ))

          plural() { (( $1 == 1 )) && echo "$1 $2" || echo "$1 $2s"; }
          value=$(plural "$years" year)
          (( months )) && value+=" $(plural "$months" month)"

          sed -i -E "s/(experience = \")[^\"]*/\1$value/" README.md

          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore: experience $value"
          git push -q
